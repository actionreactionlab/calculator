name: publish (release pipeline, holds the publish credential)

# The project's normal publish pipeline. It is NOT malicious: it publishes whatever is at
# the pushed tag to npm, authenticated with the repo's NPM_TOKEN secret. The attack never
# edits this workflow and never reads its secret. The attacker, holding the PAT stolen
# from pr-title-validation.yml, pushes a poisoned v* tag; this workflow fires (a
# PAT-authored push triggers workflows, a GITHUB_TOKEN one does not) and ships it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish whatever is at this tag
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
